name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
      - name: Restore locked application dependencies
        run: flutter pub get --enforce-lockfile
      - name: Restore core test dependencies before root analysis
        working-directory: packages/deco_core
        run: dart pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver packages/deco_core/lib packages/deco_core/test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Core analysis and tests
        working-directory: packages/deco_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Release tooling tests
        run: |
          python3 -m compileall -q tool/release
          python3 -m unittest discover -s tool/release/tests -v
      - name: Public audits and specifications
        run: |
          npm install --global @fission-ai/openspec@2.0.0
          python3 tool/release/audits.py
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: macos
            runner: macos-15
          - platform: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get --enforce-lockfile
      - name: Windows release build
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release --build-name=1.2.3 --build-number=1002003
      - name: Windows package and version validation
        if: matrix.platform == 'windows'
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python tool/release/package.py windows --source build/windows/x64/runner/Release --tag v1.2.3 --sha "$SOURCE_SHA"
      - name: Windows package launch
        if: matrix.platform == 'windows'
        timeout-minutes: 2
        run: python tool/release/smoke.py windows build/packages/DecoPlanner-v1.2.3-windows-x64.zip
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: macOS release build
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release --build-name=1.2.3 --build-number=1002003
      - name: macOS package and version validation
        if: matrix.platform == 'macos'
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tool/release/package.py macos --source build/macos/Build/Products/Release/deco_planner.app --tag v1.2.3 --sha "$SOURCE_SHA"
      - name: macOS quarantined package launch
        if: matrix.platform == 'macos'
        timeout-minutes: 2
        run: python3 tool/release/smoke.py macos build/packages/DecoPlanner-v1.2.3-macos-universal.zip
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: macOS native integration
        timeout-minutes: 10
        if: matrix.platform == 'macos'
        run: flutter test integration_test/plan_flow_test.dart -d macos
      - name: Android validation build (no release credentials)
        if: matrix.platform == 'android'
        run: flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.platform != 'android'
        with:
          name: validation-${{ matrix.platform }}
          path: build/packages/*
          retention-days: 3
          if-no-files-found: error
  gate:
    name: DecoPlanner CI gate
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tool/release/gate.py
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
